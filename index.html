<div id="fieldingContent"><div class="empty">尚無守備紀錄。</div></div><section class="analysis-card"><div class="analysis-card-head"><h2>捕手專項數據</h2><span>捕手分析</span></div><div id="catcherContent"><div class="empty">選擇比賽後顯示捕手數據。</div></div></section></section></main></div>
<dialog id="teamModal"><form id="teamForm"><div class="modalhead"><h2 id="teamTitle">新增球隊</h2><button type="button" class="x close">×</button></div><input id="teamId" type="hidden"><label>球隊名稱<input id="teamName" required maxlength="40" placeholder="例如：○○國小少棒隊"></label><label>學校／單位<input id="teamOrg" maxlength="50"></label><label>備註<textarea id="teamNote" rows="2"></textarea></label><footer><button type="button" class="close">取消</button><button class="primary">儲存球隊</button></footer></form></dialog>
<dialog id="playerModal"><form id="playerForm"><div class="modalhead"><h2 id="playerTitle">新增球員</h2><button type="button" class="x close">×</button></div><input id="playerId" type="hidden"><label>所屬球隊<select id="playerTeam" required></select></label><div class="two"><label>背號<input id="number" required maxlength="3"></label><label>球員姓名<input id="playerName" required maxlength="30"></label></div><label>守備位置<select id="position"><option value="">尚未設定</option><option>投手</option><option>捕手</option><option>一壘手</option><option>二壘手</option><option>三壘手</option><option>游擊手</option><option>左外野手</option><option>中外野手</option><option>右外野手</option><option>指定打擊</option><option>工具人</option></select></label><label>備註<textarea id="playerNote" rows="2"></textarea></label><footer><button type="button" class="close">取消</button><button class="primary">儲存球員</button></footer></form></dialog>
<dialog id="gameModal"><form id="gameForm"><div class="modalhead"><h2 id="gameTitle">建立比賽</h2><button type="button" class="x close">×</button></div><input id="gameId" type="hidden"><div class="two"><label>我方球隊<select id="gameTeam" required></select></label><label>對手名稱<input id="opponent" required maxlength="50"></label></div><label>我方攻守順序<select id="battingOrder"><option value="first">先攻（上半局進攻）</option><option value="second">後攻（下半局進攻）</option></select></label><div class="two"><label>比賽日期<input id="date" type="date" required></label><label>比賽時間<input id="time" type="time"></label></div><label>比賽地點<input id="venue" maxlength="80"></label><div class="rules"><b>⚾ 本場比賽規則</b><div class="two"><label>正規局數<select id="innings"><option value="6">6 局（預設）</option><option value="5">5 局</option><option value="7">7 局</option><option value="9">9 局</option></select></label><label>延長賽<select id="extra"><option value="true">允許延長</option><option value="false">不延長</option></select></label></div><div class="two"><label>分差提前結束<select id="mercy"><option value="none">不設定</option><option value="10">領先 10 分</option><option value="15">領先 15 分</option><option value="custom">自訂分差</option></select></label><label>最低完成局數<select id="minInnings"><option value="3">3 局</option><option value="4">4 局</option><option value="5">5 局</option></select></label></div><label id="customWrap" hidden>自訂分差<input id="customMercy" type="number" min="1" max="99"></label><small>提前結束條件僅供賽事設定，實際以該盃賽競賽規程為準。</small></div><label>備註<textarea id="gameNote" rows="2"></textarea></label><footer><button type="button" class="close">取消</button><button class="primary">儲存比賽</button></footer></form></dialog><dialog id="cloudLoginModal"><form id="cloudLoginForm"><div class="modalhead"><h2>少棒紀錄室雲端登入</h2><button type="button" class="x" id="cloudLoginClose">×</button></div><label>電子郵件<input id="cloudEmail" type="email" autocomplete="username" required></label><label>密碼<input id="cloudPassword" type="password" autocomplete="current-password" required></label><p class="muted">請使用你剛才在 Firebase Authentication 建立的帳號。此處不會建立公開註冊入口。</p><footer><button type="button" id="cloudLoginCancel">取消</button><button class="primary" id="cloudLoginSubmit">登入</button></footer><p id="cloudLoginError" class="cloud-error"></p></form></dialog><div id="toast"></div><script src="app.js"></script><script type="module" src="firebase.js"></script></body></html>
